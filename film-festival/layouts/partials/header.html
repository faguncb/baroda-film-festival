<header class="site-header">
  <div class="wrap header-bar">
    <a class="header-logo" href="{{ site.Home.RelPermalink }}">
      <img src="{{ "bff-logo.jpg" | relURL }}" alt="Baroda Film Festival Shorts 2.0">
    </a>
    <a class="brand" href="{{ site.Home.RelPermalink }}">
      <span>Baroda Film Festival</span>
    </a>
    <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav">Menu</button>
    <nav class="nav" id="site-nav" aria-label="Primary">
      <ul>
        {{ range site.Menus.main }}
          <li>
            <a href="{{ .URL }}"{{ if and (not $.IsHome) (or ($.IsMenuCurrent "main" .) ($.HasMenuCurrent "main" .)) }} aria-current="page"{{ end }}>{{ .Name }}</a>
          </li>
        {{ end }}
      </ul>
    </nav>
  </div>
</header>
